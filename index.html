<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Planeamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff2;--panel:#fff;--ink:#16202a;--mut:#5d6b78;--line:#d6dce2;--bar:#16202a;--acc:#0e6b5c;--accbg:#dff1ed;--pend:#a8510a;--pendbg:#fbeadb}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--panel:#1a232c;--ink:#e8edf1;--mut:#97a5b2;--line:#2c3945;--bar:#0b1015;--acc:#4fc3ad;--accbg:#173a34;--pend:#f0a35e;--pendbg:#3b2915}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--bar);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:10px 16px}
header h1{font-size:16px;margin:0;font-weight:600}
nav{display:flex;gap:4px}
nav button{background:transparent;color:#c5d0d9;border:0;padding:8px 14px;border-radius:6px;font:inherit;font-weight:500;cursor:pointer}
nav button[aria-selected=true]{background:#fff;color:#16202a}
.upd{margin-left:auto;font-size:12px;color:#9fb0be;display:flex;gap:10px;align-items:center}
.upd button{background:#2b3a47;color:#fff;border:0;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
main{max-width:1400px;margin:0 auto;padding:14px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.bar select,.bar input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:140px}
.bar button,.nv button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
.bar button:hover,.nv button:hover{border-color:var(--acc)}
.cnt{font-size:13px;color:var(--mut);margin:0 0 8px}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 220px)}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;padding:9px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accbg)}
.nv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.nv h2{margin:0 8px;font-size:17px;font-weight:600;min-width:240px;text-align:center}
.seg{margin-left:auto;display:flex}
.seg button{border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.days{display:grid;gap:10px}
.days.w{grid-template-columns:repeat(7,minmax(0,1fr))}
.dayc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:80px}
.dayc.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dayc h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.dayc h3 span{background:var(--accbg);color:var(--acc);border-radius:10px;padding:0 8px;font-weight:600}
.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:7px 9px;margin-bottom:6px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card.p{border-left-color:var(--pend)}
.card b{display:block}
.card small{display:block;color:var(--mut)}
.empty,.err{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--mut)}
.err{border-color:var(--pend);color:var(--ink);text-align:left;white-space:pre-wrap}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;width:min(560px,94vw);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,22,.55)}
dialog h2{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
dialog h2 button{border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;line-height:1}
dl{margin:0;padding:8px 16px 16px;max-height:70vh;overflow:auto;display:grid;grid-template-columns:minmax(110px,35%) 1fr;gap:6px 14px}
dt{color:var(--mut);font-size:12.5px}dd{margin:0;word-break:break-word}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:900px){.days.w{grid-template-columns:1fr}.nv h2{min-width:0;flex:1 1 100%;order:-1;text-align:left;margin:0}.seg{margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>Mapa de Planeamento <small style="font-weight:400;color:#9fb0be">v5</small></h1>
  <nav role="tablist">
    <button role="tab" id="t-pend" aria-selected="true">Serviços pendentes</button>
    <button role="tab" id="t-cal" aria-selected="false">Planeamento 2026</button>
  </nav>
  <div class="upd"><span id="upd">A carregar…</span><button id="reload">Atualizar</button></div>
</header>
<main id="app"></main>
<dialog id="dlg"><h2><span id="dt"></span><button id="dx" aria-label="Fechar">×</button></h2><dl id="dl"></dl></dialog>

<script>
/* ===== CONFIGURAÇÃO =====
   KEY: parte 2PACX-... do link publicado.
   gid: número da folha (aparece no URL ao abrir a folha: ...#gid=123456789).
   Se gid ficar vazio, a app tenta descobri-lo pelo nome da folha. */
const CONFIG={
  KEY:'2PACX-1vSo6rJizYl89_uc7kqJkKovy_-j5uMDE60JSjzgFB9kyIxViVtKVBb6MOv-MGkBvxS4HgxmMMbRCDes',
  pend:{name:'Serv. Pendentes',gid:'1275022172'},
  plan:{name:'2026',gid:'315116655'}
};
const BASE='https://docs.google.com/spreadsheets/d/e/'+CONFIG.KEY;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const WD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ---------- datas (chaves ISO AAAA-MM-DD) ---------- */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const toD=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(k,n)=>{const d=toD(k);d.setDate(d.getDate()+n);return iso(d)};
const mondayOf=k=>{const d=toD(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const fmt=k=>{if(!k)return'';const d=toD(k);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};
const fmtL=k=>{const d=toD(k);return WD[d.getDay()]+', '+d.getDate()+' de '+MS[d.getMonth()]+' de '+d.getFullYear()};
let DEFY=new Date().getFullYear();
const MABR={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function parseDate(s){
  s=String(s||'').trim();let m;
  if(!s)return null;
  if(m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if(m=s.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  const ns=norm(s);
  if(m=ns.match(/(\d{1,2})[\s\/\-\.]*(?:de\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?(?:[\s\/\-]*(?:de\s+)?(\d{4}|\d{2}))?(?!\d)/)){let y=m[3]?+m[3]:DEFY;if(y<100)y+=2000;return y+'-'+String(MABR[m[2]]).padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  if(m=ns.match(/(?:^|\D)(\d{1,2})\s*[\/\-]\s*(\d{1,2})\.?\s*$/)){if(+m[1]<=31&&+m[2]<=12)return DEFY+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  if(/^\d{5}(\.\d+)?$/.test(s)&&+s>40000&&+s<60000){const d=new Date(Date.UTC(1899,11,30)+Math.floor(+s)*864e5);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
  return null;
}
const TODAY=iso(new Date());

/* ---------- CSV ---------- */
function parseCSV(t){
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows;
}

/* ---------- carregar folhas ---------- */
let gids=null;
async function discover(){
  if(gids)return gids;gids={};
  const t=await (await fetch(BASE+'/pubhtml')).text();
  const re=/name:\s*"((?:[^"\\]|\\.)*)"[^}]*?gid:\s*"(\d+)"/g;let m;
  while(m=re.exec(t))gids[norm(m[1])]=m[2];
  return gids;
}
async function loadSheet(cfg){
  DEFY=/^\d{4}$/.test(cfg.name.trim())?+cfg.name.trim():new Date().getFullYear();
  let gid=cfg.gid;
  if(gid==='' ){
    try{const g=await discover();gid=g[norm(cfg.name)]}catch(e){}
    if(gid===undefined||gid==='')throw new Error('Não foi possível descobrir o gid da folha "'+cfg.name+'".\nAbra o link publicado, clique no separador da folha e copie o número a seguir a "gid=" para CONFIG no index.html.');
  }
  const u=BASE+'/pub?output=csv&gid='+gid;
  let res;
  try{res=await fetch(u+'&t='+Date.now());if(!res.ok)res=await fetch(u)}catch(e){try{res=await fetch(u)}catch(e2){throw new Error('Sem ligação à folha "'+cfg.name+'".')}}
  if(!res.ok)throw new Error('Erro '+res.status+' ao ler a folha "'+cfg.name+'" (gid '+gid+').\nNo Google Sheets, confirme em Ficheiro > Partilhar > Publicar na Web que esta folha (ou o documento inteiro) continua publicada, e que o gid no CONFIG é o do separador certo.');
  return buildTable(parseCSV(await res.text()));
}
function buildTable(raw){
  raw=raw.filter(r=>r.some(c=>c.trim()));
  let hi=0,best=-1;
  raw.slice(0,25).forEach((r,i)=>{const n=r.filter(c=>c.trim()).length;
    const k=r.filter(c=>/cliente|transportador|viatura|data|carga|matricula|destino|origem/.test(norm(c))).length;
    const sc=k*100+n;if(sc>best){best=sc;hi=i}});
  const hdr=(raw[hi]||[]).map((h,i)=>h.trim()||'Col. '+(i+1));
  const find=(...res)=>{for(const re of res){const i=hdr.findIndex(h=>re.test(norm(h)));if(i>=0)return i}return -1};
  const cols={
    cliente:find(/cliente/),
    viatura:find(/tipo.*(viatura|veiculo)/,/viatura/,/veiculo/,/semi/),
    transp:find(/transportador/,/transporte/,/transp/),
    data:find(/data.*carga/,/carga.*data/,/^data/,/data/)
  };
  const rows=raw.slice(hi+1).map(v=>{while(v.length<hdr.length)v.push('');return v}).filter(v=>v.some(c=>c.trim()));
  {const rate=i=>{const sm=rows.slice(0,200).filter(v=>(v[i]||'').trim());return sm.length?sm.filter(v=>parseDate(v[i])).length/sm.length:0};
   let cand=[];hdr.forEach((h,i)=>{if(/data|carga/.test(norm(h)))cand.push(i)});
   let bi=-1,br=0;cand.forEach(i=>{const r=rate(i);if(r>br){br=r;bi=i}});
   if(br<.5){hdr.forEach((h,i)=>{const r=rate(i);if(r>br){br=r;bi=i}})}
   cols.data=br>0?bi:cols.data}
  const recs=rows.map(v=>({v,d:cols.data>=0?parseDate(v[cols.data]):null}));
  // colunas do resumo: as encontradas + as primeiras com conteúdo
  const sum=[cols.data,cols.cliente,cols.viatura,cols.transp].filter(i=>i>=0);
  for(let i=0;i<hdr.length&&sum.length<6;i++)if(!sum.includes(i)&&recs.some(r=>r.v[i].trim()))sum.push(i);
  return{hdr,cols,recs,sum};
}

/* ---------- estado ---------- */
const T={},E={};const S={view:'pend',pend:{from:'',to:'',cliente:'',viatura:'',transp:'',q:''},cal:{cur:TODAY,mode:'dia',from:'',to:'',cliente:'',viatura:'',transp:''}};

const uniq=(t,i)=>i<0?[]:[...new Set(t.recs.map(r=>r.v[i].trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
const sel=(id,lab,opts,val)=>`<label>${lab}<select id="${id}"><option value="">Todos</option>${opts.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
function match(t,r,f,useDates){
  const c=t.cols;
  if(f.cliente&&r.v[c.cliente]?.trim()!==f.cliente)return false;
  if(f.viatura&&r.v[c.viatura]?.trim()!==f.viatura)return false;
  if(f.transp&&r.v[c.transp]?.trim()!==f.transp)return false;
  if(useDates){if(f.from&&(!r.d||r.d<f.from))return false;if(f.to&&(!r.d||r.d>f.to))return false}
  if(f.q&&!r.v.join(' ').toLowerCase().includes(f.q.toLowerCase()))return false;
  return true;
}
function filtersHTML(key,t,withQ,withDates){
  const f=S[key],c=t.cols;
  return`<div class="bar">${withDates?`<label>Data de<input type="date" id="f-from" value="${f.from}"></label><label>Data até<input type="date" id="f-to" value="${f.to}"></label>`:''}`
   +(c.cliente>=0?sel('f-cliente','Cliente',uniq(t,c.cliente),f.cliente):'')
   +(c.viatura>=0?sel('f-viatura','Tipo de viatura',uniq(t,c.viatura),f.viatura):'')
   +(c.transp>=0?sel('f-transp','Transportador',uniq(t,c.transp),f.transp):'')
   +(withQ?`<label>Pesquisa<input type="search" id="f-q" value="${esc(f.q)}" placeholder="texto livre"></label>`:'')
   +`<button id="f-clr">Limpar</button></div>`;
}
function bindFilters(key,rerender){
  const f=S[key];
  [['from','f-from'],['to','f-to'],['cliente','f-cliente'],['viatura','f-viatura'],['transp','f-transp']].forEach(([k,id])=>{
    const el=$('#'+id);if(el)el.onchange=()=>{f[k]=el.value;rerender()}});
  const q=$('#f-q');if(q)q.oninput=()=>{f.q=q.value;rerender(true)};
  $('#f-clr').onclick=()=>{Object.keys(f).forEach(k=>{if(!['cur','mode'].includes(k))f[k]=''});rerender()};
}

/* ---------- pop-up ---------- */
function openDlg(t,r){
  const c=t.cols;
  $('#dt').textContent=[r.d?fmt(r.d):'',c.cliente>=0?r.v[c.cliente]:''].filter(Boolean).join(' · ')||'Detalhe';
  $('#dl').innerHTML=t.hdr.map((h,i)=>r.v[i].trim()?`<dt>${esc(h)}</dt><dd>${esc(r.v[i])}</dd>`:'').join('');
  $('#dlg').showModal();
}
$('#dx').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close()});

/* ---------- vista: pendentes ---------- */
function viewPend(){
  const t=T.pend;
  if(!t){$('#app').innerHTML='<div class="err">'+esc(E.pend||'Folha não carregada.')+'</div>';return}
  $('#app').innerHTML=filtersHTML('pend',t,true,t.cols.data>=0)+'<div id="out"></div>';
  bindFilters('pend',keep=>{keep?drawPend():viewPend()});
  drawPend();
}
function drawPend(){
  const t=T.pend,f=S.pend;
  const rows=t.recs.filter(r=>match(t,r,f,true)).sort((a,b)=>(a.d||'9').localeCompare(b.d||'9'));
  window._rows=rows;
  $('#out').innerHTML=`<p class="cnt">${rows.length} de ${t.recs.length} serviços pendentes</p>`+(rows.length?
   `<div class="tw"><table><thead><tr>${t.sum.map(i=>`<th>${esc(t.hdr[i])}</th>`).join('')}</tr></thead><tbody>`
   +rows.map((r,n)=>`<tr data-n="${n}">${t.sum.map(i=>`<td>${esc(i===t.cols.data&&r.d?fmt(r.d):r.v[i])}</td>`).join('')}</tr>`).join('')
   +'</tbody></table></div>':'<div class="empty">Sem serviços para os filtros escolhidos.</div>');
  document.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>openDlg(t,rows[+tr.dataset.n]));
}

/* ---------- vista: calendário ---------- */
function cardHTML(t,r,n,pend){
  const c=t.cols,main=c.cliente>=0?r.v[c.cliente]:r.v[t.sum[0]];
  const l1=[c.viatura,c.transp].filter(i=>i>=0).map(i=>r.v[i].trim()).filter(Boolean).join(' · ');
  const extra=t.sum.filter(i=>![c.data,c.cliente,c.viatura,c.transp].includes(i)).slice(0,2)
    .map(i=>r.v[i].trim()?`${esc(t.hdr[i])}: ${esc(r.v[i])}`:'').filter(Boolean).join(' · ');
  return`<button class="card${pend?' p':''}" data-n="${n}"><b>${esc(main||'(sem cliente)')}</b>${l1?`<small>${esc(l1)}</small>`:''}${extra?`<small>${extra}</small>`:''}</button>`;
}
function viewCal(){
  const t=T.plan,f=S.cal;
  if(!t){$('#app').innerHTML='<div class="err">'+esc(E.plan||'Folha não carregada.')+'</div>';return}
  $('#app').innerHTML=`<div class="nv"><button id="pv" aria-label="Anterior">◀ Anterior</button><button id="td">Hoje</button><button id="nx" aria-label="Seguinte">Seguinte ▶</button>
   <input type="date" id="dp" value="${f.cur}" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit">
   <h2 id="ttl"></h2><div class="seg">${[['dia','Dia'],['semana','Semana'],['lista','Intervalo']].map(([k,l])=>`<button data-m="${k}" aria-pressed="${f.mode===k}">${l}</button>`).join('')}</div></div>`
   +filtersHTML('cal',t,false,f.mode==='lista')+'<div id="out"></div>';
  const step=f.mode==='semana'?7:1;
  $('#pv').onclick=()=>{f.cur=addDays(f.cur,-step);viewCal()};
  $('#nx').onclick=()=>{f.cur=addDays(f.cur,step);viewCal()};
  $('#td').onclick=()=>{f.cur=TODAY;viewCal()};
  $('#dp').onchange=e=>{if(e.target.value){f.cur=e.target.value;viewCal()}};
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{f.mode=b.dataset.m;viewCal()});
  bindFilters('cal',()=>viewCal());
  drawCal();
}
function drawCal(){
  const t=T.plan,f=S.cal,out=$('#out');
  if(t.cols.data<0){out.innerHTML='<div class="err">Não foi encontrada uma coluna de data de carga na folha "'+esc(CONFIG.plan.name)+'".</div>';return}
  const byDay={};t.recs.filter(r=>r.d&&match(t,r,f,false)).forEach(r=>{(byDay[r.d]=byDay[r.d]||[]).push(r)});
  const reg=[];
  const datas=Object.keys(byDay).sort();
  const diag=()=>`<div class="err" style="margin-bottom:10px">Sem cargas para os filtros/datas escolhidos.\nLinhas lidas: ${t.recs.length} · com data válida: ${t.recs.filter(r=>r.d).length} · coluna de data usada: "${esc(t.hdr[t.cols.data])}"\nExemplos de valores nessa coluna: ${esc(t.recs.map(r=>r.v[t.cols.data].trim()).filter(Boolean).slice(0,6).map(x=>'['+x+']').join(' ')||'(coluna vazia)')}${datas.length?'\nDatas com cargas: '+fmt(datas[0])+' a '+fmt(datas[datas.length-1]):'\nNenhuma linha tem data reconhecida. Cabeçalhos lidos: '+esc(t.hdr.join(' | '))}</div>${datas.length?'<p><button id="near" style="font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer">Ir para a data com cargas mais próxima</button></p>':''}`;
  const dayBlock=k=>{const rs=byDay[k]||[];return`<section class="dayc${k===TODAY?' today':''}"><h3>${esc(fmtL(k).replace(/ de \d{4}$/,''))}<span>${rs.length}</span></h3>`
    +rs.map(r=>{reg.push(r);return cardHTML(t,r,reg.length-1)}).join('')+(rs.length?'':'<small style="color:var(--mut)">Sem cargas</small>')+'</section>'};
  const bindNear=()=>{const b=$('#near');if(b)b.onclick=()=>{f.cur=datas.reduce((x,k)=>Math.abs(toD(k)-toD(TODAY))<Math.abs(toD(x)-toD(TODAY))?k:x,datas[0]);viewCal()}};
  if(f.mode==='dia'){$('#ttl').textContent=fmtL(f.cur);out.innerHTML=((byDay[f.cur]||[]).length?'':diag())+'<div class="days">'+dayBlock(f.cur)+'</div>';bindNear()}
  else if(f.mode==='semana'){const m=mondayOf(f.cur);$('#ttl').textContent='Semana de '+fmt(m)+' a '+fmt(addDays(m,6));
    const inW=[0,1,2,3,4,5,6].some(i=>(byDay[addDays(m,i)]||[]).length);
    out.innerHTML=(inW?'':diag())+'<div class="days w">'+[0,1,2,3,4,5,6].map(i=>dayBlock(addDays(m,i))).join('')+'</div>';bindNear()}
  else{const ks=Object.keys(byDay).filter(k=>(!f.from||k>=f.from)&&(!f.to||k<=f.to)).sort();
    $('#ttl').textContent=ks.length?ks.length+' dias com cargas':'Intervalo';
    out.innerHTML=ks.length?'<div class="days">'+ks.map(dayBlock).join('')+'</div>':'<div class="empty">Sem cargas no intervalo escolhido. Defina "Data de" e "Data até".</div>'}
  out.querySelectorAll('.card').forEach(b=>b.onclick=()=>openDlg(t,reg[+b.dataset.n]));
}

/* ---------- arranque ---------- */
function show(v){
  S.view=v;$('#t-pend').setAttribute('aria-selected',v==='pend');$('#t-cal').setAttribute('aria-selected',v==='cal');
  v==='pend'?viewPend():viewCal();
}
$('#t-pend').onclick=()=>show('pend');$('#t-cal').onclick=()=>show('cal');
async function load(){
  $('#upd').textContent='A carregar…';$('#app').innerHTML='<div class="empty">A ler dados da folha…</div>';
  try{
    gids=null;
    const[a,b]=await Promise.allSettled([loadSheet(CONFIG.pend),loadSheet(CONFIG.plan)]);
    T.pend=a.value||null;T.plan=b.value||null;E.pend=a.reason?a.reason.message:'';E.plan=b.reason?b.reason.message:'';
    $('#upd').textContent=(T.pend||T.plan)?'Atualizado às '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}):'Erro ao carregar';
    show(S.view);
  }catch(e){
    $('#upd').textContent='Erro ao carregar';
    $('#app').innerHTML='<div class="err">'+esc(e.message)+'</div>';
  }
}
$('#reload').onclick=load;
load();
</script>
